definitions:
  npm_workspace_install: &npm_workspace_install
    name: Install dependencies (npm workspaces)
    script: npm ci
  build_web: &build_web
    name: Build the web bundle (apps/web/dist — what Capacitor wraps)
    script: npm run build --workspace apps/web

  # Shared by both Android workflows below — everything up to the final
  # Gradle command is identical whether the output is an .aab (for Play
  # Console) or a plain .apk (for a direct sideload install).
  android_environment: &android_environment
    android_signing:
      - fullset-android-keystore
    groups:
      - firebase_android
    node: 22.11.0
    # Capacitor 8 generates apps/web/android/app/capacitor.build.gradle with
    # sourceCompatibility/targetCompatibility JavaVersion.VERSION_21 itself,
    # regenerated on every `cap sync` — matching the build machine's JDK to
    # that (rather than fighting Capacitor's own file) is the fix for
    # "invalid source release: 21".
    java: 21
  # YAML anchors can't splice a shared list of steps followed by a workflow-
  # specific final step, so the four setup steps below (restore config, cap
  # sync, write keystore.properties) are duplicated as literal text across
  # android-release and android-apk rather than referenced from here — only
  # the individually-anchored npm_workspace_install/build_web steps are
  # actually reused. Keep both copies in sync if either changes.
  restore_google_services: &restore_google_services
    name: Restore google-services.json
    script: |
      if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
        echo "$GOOGLE_SERVICES_JSON" > apps/web/android/app/google-services.json
      fi
  cap_sync_android: &cap_sync_android
    name: Sync the web build into the Android shell
    script: cd apps/web && npx cap sync android
  write_keystore_properties: &write_keystore_properties
    name: Write keystore.properties from Codemagic's injected signing vars
    script: |
      cat > apps/web/android/app/keystore.properties <<EOF
      storeFile=$CM_KEYSTORE_PATH
      storePassword=$CM_KEYSTORE_PASSWORD
      keyAlias=$CM_KEY_ALIAS
      keyPassword=$CM_KEY_PASSWORD
      EOF

workflows:
  android-release:
    name: Android release
    max_build_duration: 60
    environment:
      <<: *android_environment
    scripts:
      - *npm_workspace_install
      - *build_web
      - *restore_google_services
      - *cap_sync_android
      - *write_keystore_properties
      - name: Build the signed release bundle (.aab, for Play Console)
        script: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - apps/web/android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - abzydey@gmail.com

  # Same signing, same everything — just assembleRelease instead of
  # bundleRelease, which outputs a plain .apk you can download straight to a
  # phone and install directly (no Play Console account or upload needed).
  # Good for a real-device sanity check before bothering with the store.
  android-apk:
    name: Android APK (direct install)
    max_build_duration: 60
    environment:
      <<: *android_environment
    scripts:
      - *npm_workspace_install
      - *build_web
      - *restore_google_services
      - *cap_sync_android
      - *write_keystore_properties
      - name: Build the signed installable APK
        script: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - apps/web/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - abzydey@gmail.com

  ios-release:
    name: iOS release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        # Register the app in App Store Connect with bundle ID au.fullset.app
        # first, then connect it here — App settings -> Code signing
        # identities -> iOS -> Automatic. Codemagic then fetches/creates the
        # certificate and provisioning profile itself for every build.
        distribution_type: app_store
        bundle_identifier: au.fullset.app
      groups:
        # Same file, second copy — ios/App/App/GoogleService-Info.plist isn't
        # in the repo either. One secure file variable, GOOGLE_SERVICE_INFO_PLIST.
        - firebase_ios
      vars:
        XCODE_SCHEME: "App"
        XCODE_PROJECT: "apps/web/ios/App/App.xcodeproj"
      node: 22.11.0
      xcode: latest
    integrations:
      # Name of the App Store Connect API key added under Team settings ->
      # Integrations in Codemagic — needed for automatic signing above and
      # for the App Store Connect publish step below.
      app_store_connect: fullset-asc-key
    scripts:
      - *npm_workspace_install
      - *build_web
      - name: Restore GoogleService-Info.plist
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" > apps/web/ios/App/App/GoogleService-Info.plist
          fi
      - name: Sync the web build into the iOS shell
        script: cd apps/web && npx cap sync ios
      - name: Fetch signing files matching the bundle ID above
        script: xcode-project use-profiles
      - name: Build the archive and export an IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - abzydey@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
